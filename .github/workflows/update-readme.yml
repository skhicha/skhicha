name: Update profile README

on:
  schedule:
    - cron: "0 3 * * *"   # daily safety-net run at 03:00 UTC
  workflow_dispatch: {}     # manual "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/update_readme.py"
  repository_dispatch:
    types: [repo-updated]   # fired by other repos' notify-profile.yml on every push

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        env:
          GH_TOKEN: ${{ secrets.REPO_SCAN_TOKEN }}
        run: |
          python scripts/update_readme.py
          mv README_generated.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Auto-update README from repo scan"
          git push
